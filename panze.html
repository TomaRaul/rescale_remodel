<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your canvases · Image + text restructuring</title>
<style>
  /* Aceeași paletă ca a porții și a aplicației. Se repetă dinadins: proiectul n-are
     pas de build și n-are niciun fișier CSS, iar o pagină care ar aștepta un al doilea
     fișier ar putea să se arate nestilizată exact în clipa în care e citită. */
  :root{--bg:#ffffff;--panel:#ffffff;--line:#d7dee8;--ink:#000000;
        --dim:#55606f;--accent:#1d4ed8;--ok:#047857;--bad:#be123c;--camp:#f7f9fc}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.5 "Segoe UI",system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

  .poarta{width:100%;max-width:440px}
  .cap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
  h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.01em}
  .cine{font-size:11px;color:var(--dim);font-family:"Cascadia Code",Consolas,monospace;
        overflow-wrap:anywhere;text-align:right}
  .sub{color:var(--dim);font-size:12.5px;margin:0 0 18px;line-height:1.5}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  button{background:#f1f4f9;border:1px solid var(--line);color:var(--ink);border-radius:7px;
         padding:8px 12px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
  button:hover:not(:disabled){background:#e4eaf3;border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  #noua{background:var(--accent);border-color:var(--accent);color:#ffffff;width:100%;
        padding:10px 12px;font-size:13px}
  #noua:hover:not(:disabled){background:#1e40af;border-color:#1e40af}

  /* Un rând pe pânză: numele deschide, data se citește, × șterge. */
  .panza{display:flex;align-items:center;gap:10px;padding:9px 0;
         border-bottom:1px dashed var(--line);font-size:13px}
  .panza:last-child{border:0}
  .panza b{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer;color:var(--accent);
           font-weight:600}
  .panza b:hover{text-decoration:underline}
  .panza span{color:var(--dim);font-size:10.5px;white-space:nowrap}
  .panza button{padding:1px 8px;font-size:12px;line-height:1.3}

  h2{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
     margin:0 0 9px;font-weight:600}
  .note{font-size:10.5px;color:var(--dim);margin-top:12px;line-height:1.5}
  .note.bad{color:var(--bad)}
  .jos{margin-top:14px;text-align:center}
  .jos button{font-size:11px;padding:5px 10px}
</style>
</head>
<body hidden>

<main class="poarta">
  <div class="cap">
    <h1>Your canvases</h1>
    <div class="cine" id="cine">—</div>
  </div>
  <p class="sub">
    Open one of your saved canvases, or start a new one. They are visible only to you.
  </p>

  <div class="panel">
    <button id="noua">New canvas</button>

    <h2 style="margin:16px 0 4px">saved</h2>
    <div id="lista"><span class="dim">loading…</span></div>

    <div class="note" id="mesaj"></div>
  </div>

  <div class="jos">
    <button id="iesi">Sign out</button>
  </div>
</main>

<script type="module">
  import { PanouPanze } from './src/cont/PanouPanze.js';
  new PanouPanze();
</script>
</body>
</html>
